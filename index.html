<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VOZX RideCompare - One Ride. All Prices.</title>

  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <meta name="theme-color" content="#020617">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Master Stylesheet -->
  <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body class="bg-[#020617] text-white min-h-screen flex items-center justify-center relative selection:bg-blue-600 selection:text-white">

  <!-- Ambient Radial Glow Backdrop for Desktop & Tablet -->
  <div class="ambient-glow-mesh"></div>

  <!-- Master Stage Wrapper -->
  <main class="stage-wrapper">

    <!-- Get Started Hero Card (Adapts automatically to Mobile, Tablet, and Desktop) -->
    <div class="get-started-card">

      <!-- Top Section: 3D Logo + Titles + Description -->
      <div class="w-full flex flex-col items-center">

        <!-- 3D Metallic R Logo Emblem with Electric Blue/Cyan Glow -->
        <div class="logo-emblem-container">
          <img src="assets/images/logo_cropped_clean.png" alt="VOZX Logo" class="logo-emblem-img">
        </div>

        <!-- Title: Ride in White, Compare in Electric Blue -->
        <h1 class="brand-title">
          Ride<span class="text-blue">Compare</span>
        </h1>

        <!-- Tagline: One Ride. All Prices. -->
        <p class="brand-tagline">
          One Ride. All Prices.
        </p>

        <!-- Paragraph Description -->
        <p class="brand-description">
          Compare prices from<br>
          all ride apps. Choose the best.<br>
          Save money. Travel smarter.
        </p>

      </div>

      <!-- Middle Section: Luxury Black Sports Car & Cyberpunk Skyline Hero -->
      <div class="car-hero-wrapper">
        <img src="assets/images/car_skyline_hero.png" alt="Luxury Sports Car in Cyberpunk City" class="car-hero-img">
      </div>

      <!-- Bottom Section: "Get Started" Primary Button + "Login" Link -->
      <div class="actions-wrapper">
        <!-- Get Started Button -->
        <button id="btn-get-started" onclick="app.onGetStarted()" class="btn-get-started">
          Get Started
        </button>

        <!-- Login Text Button -->
        <button id="btn-login" onclick="app.onLogin()" class="btn-login">
          Login
        </button>


      </div>

    </div>

  </main>

  <!-- Interactive Feedback Toast -->
  <div id="app-toast">Welcome to VOZX RideCompare! 🚀</div>

  <!-- Scripts -->
  <script src="js/audio.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
