<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VOZX RideCompare - One Ride. All Prices.</title>
  
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00020A">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#020617] text-white min-h-screen flex flex-col items-center justify-center py-0 sm:py-6 px-0 sm:px-4">

  <!-- ======================================================== -->
  <!-- SINGLE EXACT MOBILE UI FRAME (MATCHING REFERENCE EXACTLY) -->
  <!-- ======================================================== -->
  <main id="app-viewport" class="exact-phone-wrapper">

    <!-- iOS Top Status Bar -->
    <div class="status-bar-exact">
      <span>9:41</span>
      <div class="flex items-center gap-1.5">
        <!-- Cellular Signal (4 bars) -->
        <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
          <path d="M2 17h3v4H2v-4zm6-5h3v9H8v-9zm6-5h3v14h-3V7zm6-5h3v19h-3V2z"/>
        </svg>
        <!-- Wifi Icon -->
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.14 0M1.393 9.393c5.857-5.857 15.355-5.857 21.213 0"/>
        </svg>
        <!-- Battery Icon -->
        <div class="w-5 h-2.5 rounded-[4px] border border-white p-[1px] flex items-center relative">
          <div class="w-3 h-full bg-white rounded-[1.5px]"></div>
          <div class="w-0.5 h-1 bg-white absolute -right-1 top-0.5 rounded-r-[1px]"></div>
        </div>
      </div>
    </div>

    <!-- Car & Skyline Hero Artwork Layer (Positioned behind content) -->
    <div class="hero-car-layer">
      <!-- Ambient radial blue glow behind car -->
      <div class="absolute w-72 h-44 rounded-full bg-[#0073FF]/15 blur-3xl -top-8 pointer-events-none"></div>
      <!-- Exact Sports Car Hero with glowing neon red tail light bar & city skyline -->
      <img src="assets/images/exact_car_hero.png" alt="Luxury Sports Car" class="w-full object-contain">
    </div>

    <!-- Screen Content Container -->
    <div class="flex-1 flex flex-col justify-between relative overflow-hidden px-6 pt-3 pb-3 z-10">

      <!-- Upper Section: 3D Logo & Typography -->
      <div class="relative z-10 text-center pt-2">
        <!-- 3D Metallic Electric-Blue R Logo with Lightning Notch -->
        <div class="w-20 h-20 mx-auto mb-2 flex items-center justify-center">
          <img src="assets/images/logo_hd_transparent.png" alt="VOZX Logo" class="w-full h-full object-contain filter drop-shadow-[0_0_18px_rgba(56,189,248,0.45)]">
        </div>

        <!-- Brand Name: "Ride" white, "Compare" electric blue -->
        <h1 class="text-3xl font-extrabold tracking-tight text-white mb-0.5">
          Ride<span class="text-[#0073FF]">Compare</span>
        </h1>

        <!-- Tagline: "One Ride. All Prices." -->
        <p class="text-xs text-[#94A3B8] font-medium tracking-wide">
          One Ride. All Prices.
        </p>

        <!-- 3-Line Description -->
        <div class="mt-8 px-4">
          <p class="text-[13.5px] text-[#CBD5E1] leading-relaxed font-normal">
            Compare prices from<br>
            all ride apps. Choose the best.<br>
            Save money. Travel smarter.
          </p>
        </div>
      </div>

      <!-- Lower Section: Action Buttons -->
      <div class="relative z-20 space-y-3 pb-2">
        <!-- Primary CTA: "Get Started" Blue Pill Button -->
        <button id="btn-get-started" onclick="app.handleGetStarted()" class="btn-get-started">
          Get Started
        </button>

        <!-- Secondary CTA: "Login" Text Link -->
        <button id="btn-login" onclick="app.handleLogin()" class="btn-login-link">
          Login
        </button>
      </div>

    </div>

    <!-- iOS Bottom Home Indicator Bar -->
    <div class="home-bar-exact"></div>

  </main>

  <!-- Interactive Feedback Toast -->
  <div id="app-toast" class="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-[#0B1220]/95 border border-[rgba(59,130,246,0.35)] shadow-[0_10px_30px_rgba(0,0,0,0.8)] text-[#38BDF8] text-xs font-semibold py-2.5 px-5 rounded-2xl text-center opacity-0 translate-y-4 pointer-events-none transition-all duration-300 backdrop-blur-md">
    Toast message
  </div>

  <!-- Subtle Floating Sound Button (Bottom Right of screen) -->
  <button id="btn-toggle-sound" onclick="app.toggleSound()" class="audio-toggle-btn">
    <svg id="sound-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
    </svg>
    <span id="sound-status-text">Audio ON</span>
  </button>

  <!-- Scripts -->
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
